<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bomberman - Lobby</title>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Silkscreen', monospace;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: #eee;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }

      h1 {
        color: #e94560;
        margin-bottom: 30px;
        text-shadow: 2px 2px 0 #0f3460;
      }

      .lobby-container {
        width: 100%;
        max-width: 800px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .btn {
        font-family: 'Silkscreen', monospace;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
        text-transform: uppercase;
      }

      .btn-primary {
        background: #e94560;
        color: #eee;
      }

      .btn-primary:hover {
        background: #ff6b6b;
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: #0f3460;
        color: #eee;
      }

      .btn-secondary:hover {
        background: #1a1a2e;
      }

      .rooms-list {
        display: grid;
        gap: 12px;
      }

      .room-card {
        background: rgba(22, 33, 62, 0.8);
        border: 2px solid #0f3460;
        border-radius: 12px;
        padding: 16px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .room-card:hover {
        border-color: #e94560;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(233, 69, 96, 0.3);
      }

      .room-card.locked {
        opacity: 0.7;
      }

      .room-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .room-name {
        font-size: 18px;
        font-weight: bold;
        color: #e94560;
      }

      .room-status {
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 4px;
        background: #0f3460;
      }

      .room-status.playing {
        background: #e94560;
      }

      .room-info {
        display: flex;
        gap: 16px;
        font-size: 12px;
        color: #aaa;
      }

      .room-info span {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .empty-state {
        text-align: center;
        padding: 40px;
        color: #666;
        font-size: 14px;
      }

      /* Modal Styles */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .modal-overlay.active {
        display: flex;
      }

      .modal {
        background: #16213e;
        border: 2px solid #e94560;
        border-radius: 12px;
        padding: 24px;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .modal-title {
        font-size: 18px;
        color: #e94560;
      }

      .modal-close {
        background: none;
        border: none;
        color: #666;
        font-size: 24px;
        cursor: pointer;
      }

      .modal-close:hover {
        color: #e94560;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 12px;
        color: #aaa;
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 10px;
        border: 2px solid #0f3460;
        border-radius: 6px;
        background: #1a1a2e;
        color: #eee;
        font-family: 'Silkscreen', monospace;
        font-size: 14px;
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: #e94560;
      }

      .modal-actions {
        display: flex;
        gap: 12px;
        margin-top: 20px;
      }

      .modal-actions .btn {
        flex: 1;
      }

      /* Room Details Modal */
      .room-details-content {
        margin-bottom: 20px;
      }

      .detail-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #0f3460;
      }

      .detail-row:last-child {
        border-bottom: none;
      }

      .detail-label {
        color: #aaa;
        font-size: 12px;
      }

      .detail-value {
        color: #eee;
        font-size: 12px;
      }

      .players-list {
        margin-top: 16px;
      }

      .players-list h4 {
        color: #e94560;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .player-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        background: #1a1a2e;
        border-radius: 6px;
        margin-bottom: 4px;
      }

      .player-host {
        color: #e94560;
        font-size: 10px;
      }

      .loading {
        text-align: center;
        padding: 20px;
        color: #666;
      }

      .error-message {
        background: rgba(233, 69, 96, 0.2);
        border: 1px solid #e94560;
        color: #e94560;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 16px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>🎮 BOMBERMAN LOBBY</h1>
    
    <div class="lobby-container">
      <div class="header">
        <div>
          <span id="connectionStatus" class="room-status">Desconectado</span>
        </div>
        <button class="btn btn-primary" onclick="openCreateModal()">+ Criar Sala</button>
      </div>

      <div id="roomsList" class="rooms-list">
        <div class="loading">Carregando salas...</div>
      </div>
    </div>

    <!-- Create Room Modal -->
    <div id="createModal" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3 class="modal-title">Criar Nova Sala</h3>
          <button class="modal-close" onclick="closeCreateModal()">&times;</button>
        </div>
        <div id="createError" class="error-message" style="display: none;"></div>
        <div class="form-group">
          <label for="roomName">Nome da Sala</label>
          <input type="text" id="roomName" placeholder="Minha Sala" maxlength="30" />
        </div>
        <div class="form-group">
          <label for="maxPlayers">Quantidade de Jogadores</label>
          <select id="maxPlayers">
            <option value="2">2 Jogadores</option>
            <option value="3">3 Jogadores</option>
            <option value="4" selected>4 Jogadores</option>
          </select>
        </div>
        <div class="form-group">
          <label for="roomPassword">Senha (Opcional)</label>
          <input type="password" id="roomPassword" placeholder="Deixe em branco para sala pública" />
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeCreateModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="createRoom()">Criar Sala</button>
        </div>
      </div>
    </div>

    <!-- Room Details Modal -->
    <div id="detailsModal" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3 class="modal-title">Detalhes da Sala</h3>
          <button class="modal-close" onclick="closeDetailsModal()">&times;</button>
        </div>
        <div id="detailsError" class="error-message" style="display: none;"></div>
        <div id="roomDetailsContent" class="room-details-content">
          <!-- Room details will be inserted here -->
        </div>
        <div class="form-group" id="passwordGroup" style="display: none;">
          <label for="joinPassword">Senha da Sala</label>
          <input type="password" id="joinPassword" placeholder="Digite a senha" />
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeDetailsModal()">Cancelar</button>
          <button class="btn btn-primary" id="joinBtn" onclick="joinRoom()">Participar</button>
        </div>
      </div>
    </div>

    <script>
      let socket = null;
      let rooms = [];
      let selectedRoom = null;
      let refreshInterval = null;
      let currentPlayerId = null; // Will be assigned by server

      // Initialize
      document.addEventListener('DOMContentLoaded', () => {
        connectSocket();
      });

      function connectSocket() {
        const isLocalServer = 
          window.location.hostname === 'localhost' || 
          window.location.hostname === '127.0.0.1';
        
        const socketUrl = isLocalServer ? 'http://localhost:3001' : undefined;

        socket = io(socketUrl, {
          transports: ['websocket', 'polling'], // Allow both transports for better compatibility
          reconnection: true,
          reconnectionAttempts: 5,
          reconnectionDelay: 1000,
          timeout: 120000, // 120 seconds timeout
        });

        socket.on('connect', () => {
          document.getElementById('connectionStatus').textContent = 'Conectado';
          document.getElementById('connectionStatus').style.background = '#00ff88';
          document.getElementById('connectionStatus').style.color = '#1a1a2e';
          listRooms();
          startAutoRefresh();
        });

        socket.on('reconnect', () => {
          console.log('Socket reconnected');
          listRooms();
        });

        socket.on('disconnect', () => {
          document.getElementById('connectionStatus').textContent = 'Desconectado';
          document.getElementById('connectionStatus').style.background = '#e94560';
          document.getElementById('connectionStatus').style.color = '#eee';
          stopAutoRefresh();
        });

        socket.on('rooms-list', (data) => {
          rooms = data.rooms || [];
          displayRooms();
        });

        socket.on('room-created', (data) => {
          // Redirect to waiting room - server will assign player ID
          window.location.href = `waiting-room.html?roomId=${encodeURIComponent(data.roomId)}&isCreator=true`;
        });

        socket.on('room-details', (data) => {
          displayRoomDetails(data.room);
        });

        socket.on('room-error', (error) => {
          showError(error.message);
        });

        socket.on('player-assigned', (data) => {
          currentPlayerId = data.playerId;
          console.log(`Player ID atribuído: ${data.playerId}`);
          
          // Redirect to waiting room when player ID is assigned (only once)
          if (selectedRoom && !window.location.href.includes('waiting-room.html')) {
            window.location.href = `waiting-room.html?roomId=${encodeURIComponent(selectedRoom.id)}`;
          }
        });

        socket.on('room-state', (state) => {
          // Successfully joined room, redirect to waiting room
          if (selectedRoom && state.roomId === selectedRoom.id) {
            // Find the current player's ID from the room state
            const myPlayer = Array.from(state.players || []).find(p => p.id === socket.id);
            const assignedPlayerId = myPlayer?.playerId || 'player-1';
            currentPlayerId = assignedPlayerId; // Store for future use
            // Don't redirect here anymore, let player-assigned handle it
          }
        });

        socket.on('game-starting', (data) => {
          // Redirect to game - playerId will be obtained from server
          window.location.href = `index.html?roomId=${encodeURIComponent(data.roomId)}`;
        });
      }

      function startAutoRefresh() {
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(listRooms, 3000);
      }

      function stopAutoRefresh() {
        if (refreshInterval) {
          clearInterval(refreshInterval);
          refreshInterval = null;
        }
      }

      function listRooms() {
        if (socket && socket.connected) {
          socket.emit('list-rooms');
        }
      }

      function displayRooms() {
        const container = document.getElementById('roomsList');
        
        if (!rooms || rooms.length === 0) {
          container.innerHTML = '<div class="empty-state">Nenhuma sala disponível. Crie uma nova sala!</div>';
          return;
        }

        container.innerHTML = rooms.map(room => `
          <div class="room-card ${room.locked ? 'locked' : ''}" onclick="openDetailsModal('${room.id}')">
            <div class="room-header">
              <span class="room-name">${escapeHtml(room.name)}</span>
              <span class="room-status ${room.status === 'playing' ? 'playing' : ''}">
                ${room.locked ? '🔒 EM JOGO' : (room.status === 'waiting' ? '⏳ AGUARDANDO' : room.status)}
              </span>
            </div>
            <div class="room-info">
              <span>👥 ${room.currentPlayers}/${room.maxPlayers}</span>
              <span>${room.hasPassword ? '🔒 Privada' : '🔓 Pública'}</span>
            </div>
          </div>
        `).join('');
      }

      function openCreateModal() {
        document.getElementById('createModal').classList.add('active');
        document.getElementById('createError').style.display = 'none';
        document.getElementById('roomName').value = '';
        document.getElementById('roomPassword').value = '';
      }

      function closeCreateModal() {
        document.getElementById('createModal').classList.remove('active');
      }

      function createRoom() {
        const name = document.getElementById('roomName').value.trim();
        const maxPlayers = parseInt(document.getElementById('maxPlayers').value);
        const password = document.getElementById('roomPassword').value;

        if (!name) {
          showCreateError('Digite um nome para a sala');
          return;
        }

        socket.emit('create-room-with-config', {
          name,
          maxPlayers,
          password: password || null,
          playerId: null // Let server assign the player ID
        });

        closeCreateModal();
      }

      function showCreateError(message) {
        const errorEl = document.getElementById('createError');
        errorEl.textContent = message;
        errorEl.style.display = 'block';
      }

      function openDetailsModal(roomId) {
        selectedRoom = rooms.find(r => r.id === roomId);
        if (!selectedRoom) return;

        document.getElementById('detailsModal').classList.add('active');
        document.getElementById('detailsError').style.display = 'none';
        document.getElementById('passwordGroup').style.display = selectedRoom.hasPassword ? 'block' : 'none';
        document.getElementById('joinPassword').value = '';

        socket.emit('get-room-details', { roomId });
      }

      function closeDetailsModal() {
        document.getElementById('detailsModal').classList.remove('active');
        selectedRoom = null;
      }

      function displayRoomDetails(room) {
        const container = document.getElementById('roomDetailsContent');
        
        const playersHtml = room.players && room.players.length > 0 
          ? room.players.map(p => `
              <div class="player-item">
                <span>🎮 ${escapeHtml(p.playerId)}</span>
                ${p.isHost ? '<span class="player-host">👑 HOST</span>' : ''}
              </div>
            `).join('')
          : '<p style="color: #666; font-size: 12px;">Nenhum jogador na sala</p>';

        container.innerHTML = `
          <div class="detail-row">
            <span class="detail-label">Nome</span>
            <span class="detail-value">${escapeHtml(room.name)}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Jogadores</span>
            <span class="detail-value">${room.currentPlayers}/${room.maxPlayers}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Status</span>
            <span class="detail-value">${room.locked ? '🔒 Em jogo' : '⏳ Aguardando'}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Tipo</span>
            <span class="detail-value">${room.hasPassword ? '🔒 Privada' : '🔓 Pública'}</span>
          </div>
          <div class="players-list">
            <h4>Jogadores na Sala</h4>
            ${playersHtml}
          </div>
        `;

        // Disable join button if room is locked or full
        const joinBtn = document.getElementById('joinBtn');
        if (room.locked) {
          joinBtn.disabled = true;
          joinBtn.textContent = 'Sala em Jogo';
          joinBtn.style.opacity = '0.5';
        } else if (room.currentPlayers >= room.maxPlayers) {
          joinBtn.disabled = true;
          joinBtn.textContent = 'Sala Cheia';
          joinBtn.style.opacity = '0.5';
        } else {
          joinBtn.disabled = false;
          joinBtn.textContent = 'Participar';
          joinBtn.style.opacity = '1';
        }
      }

      function joinRoom() {
        if (!selectedRoom) return;

        // Don't join here - let waiting-room handle the join
        // Just redirect to waiting-room with roomId
        const password = selectedRoom.hasPassword ? document.getElementById('joinPassword').value : null;
        
        // Store password in sessionStorage for waiting-room to use
        if (password) {
          sessionStorage.setItem('roomPassword', password);
        } else {
          sessionStorage.removeItem('roomPassword');
        }
        
        window.location.href = `waiting-room.html?roomId=${encodeURIComponent(selectedRoom.id)}`;
      }

      function showError(message) {
        const errorEl = document.getElementById('detailsError');
        if (document.getElementById('detailsModal').classList.contains('active')) {
          errorEl.textContent = message;
          errorEl.style.display = 'block';
        } else {
          alert(message);
        }
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    </script>
  </body>
</html>
