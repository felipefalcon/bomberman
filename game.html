<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bomberman - PixiJS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #222;
        font-family: 'Silkscreen', monospace;
      }
      #game {
        display: inline-flex;
      }
      /* Font loading indicator */
      #font-loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #666;
        font-size: 14px;
        z-index: 1000;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="font-loading">Carregando fonte...</div>
    <div id="game"></div>
    <script>
      // Check if required parameters are present
      const params = new URLSearchParams(window.location.search);
      const roomId = params.get('roomId');
      const playerId = params.get('playerId');

      if (!roomId || !playerId) {
        // Redirect to lobby if parameters are missing
        window.location.href = '/index.html';
      }

      // Wait for Silkscreen font to load before starting the game
      document.fonts.ready.then(() => {
        const fontLoading = document.getElementById('font-loading');
        if (fontLoading) {
          fontLoading.classList.add('hidden');
        }
        // Load the game script after font is ready
        const script = document.createElement('script');
        script.type = 'module';
        script.src = '/src/main.js';
        document.body.appendChild(script);
      });
    </script>
  </body>
</html>
